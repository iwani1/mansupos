# Mansu POS platform behind nginx: one wildcard certificate for the base
# domain and every shop address (<slug>.mansupos.com). Get it with a DNS-01
# challenge, e.g.:
#   certbot certonly --dns-<provider> -d mansupos.com -d '*.mansupos.com'
# Replace mansupos.com below if your base domain differs (it must equal
# PLATFORM_BASE_DOMAIN).

limit_req_zone $binary_remote_addr zone=mansu_platform:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mansupos.com *.mansupos.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mansupos.com *.mansupos.com;

    ssl_certificate     /etc/letsencrypt/live/mansupos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mansupos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mansu_ssl:10m;

    # The app sets CSP, frame and content-type headers itself; HSTS lives here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 2m;

    location / {
        limit_req zone=mansu_platform burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # The platform routes by Host: pass it through unchanged.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
