# Mansu POS — nginx hardening for the live POS host (pos.mansutrendzgh.com).
# Not applied automatically: the live site's nginx file was set up on the server.
#
# 1) Server-wide (safe for every site on the box). Copy to /etc/nginx/conf.d/mansu-hardening.conf:
#
#      server_tokens off;                      # hide "nginx/1.24.0 (Ubuntu)" from responses and error pages
#      limit_req_zone $binary_remote_addr zone=mansu_login:10m rate=10r/m;
#
# 2) Inside the existing `server { ... server_name pos.mansutrendzgh.com; ... }` block:
#
#      client_max_body_size 10m;               # product photos are up to 8 MB (default 1m refuses them with 413)
#
#      # Extra brake on password guessing, in front of the POS's own limits
#      # (12 tries / 15 min per IP, account lock after 8 failures).
#      location = /api/auth/login {
#          limit_req zone=mansu_login burst=5 nodelay;
#          limit_req_status 429;
#          proxy_pass http://127.0.0.1:PORT;   # same port as the block's main location /
#          proxy_set_header Host $host;
#          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#          proxy_set_header X-Forwarded-Proto $scheme;
#      }
#
#      # Never serve dotfiles even if one is ever placed in the web root.
#      location ~ /\.(?!well-known/) { return 404; }
#
# 3) Check and reload:
#      sudo nginx -t && sudo systemctl reload nginx
#      curl -sI https://pos.mansutrendzgh.com/ | grep -i '^server:'     # expect "Server: nginx" with no version
