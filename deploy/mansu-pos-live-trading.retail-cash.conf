# systemd drop-in: owner-approved CASH-ONLY RETAIL for the separate trading
# service (2026-11-16). Install as:
#   /etc/systemd/system/mansu-pos-live-trading.service.d/retail-cash.conf
# Rollback: delete this file, `systemctl daemon-reload`, restart the service.
# The base unit then pins every write gate OFF again.
#
# Enables ONLY Woo Retail cash orders (POS_LIVE_RETAIL_CASH_DIRECT). Wholesale,
# MoMo/card, the reservation bridge, offline tills, POS-only in-store stock and
# staging flags stay pinned OFF even if the env file says otherwise.
# POS_OWNER_APPROVAL_REFERENCE (8+ chars) and the Read/Write Woo key come from
# the private env file; without them preflight and startup refuse to run.
# Public origin is the single POS domain after the Nginx cutover.
[Service]
ExecStartPre=
ExecStart=
ExecStartPre=/usr/bin/env NODE_ENV=production POS_MODE=live POS_LIVE_READ_ONLY=false POS_ALLOW_LIVE_WRITES=true POS_LIVE_RETAIL_CASH_DIRECT=true POS_LIVE_WHOLESALE_APPROVED=false POS_LIVE_WHOLESALE_ACCEPTANCE_REFERENCE= POS_ONLINE_BRIDGE_LIVE_ENABLED=false POS_ONLINE_BRIDGE_LOCAL_TEST=false POS_INSTORE_CASH_APPROVED=false POS_DESKTOP_SETUP_APPROVED=false POS_DESKTOP_RESERVATION_APPROVED=false POS_INSTORE_ACCEPTANCE_REFERENCE= POS_INSTORE_SOURCE_SHA256= POS_STAGING_APPROVED=false POS_STAGING_WHOLESALE_APPROVED=false POS_BIND_HOST=127.0.0.1 PORT=3188 POS_DATA_DIR=/var/lib/mansu-pos-live-trading POS_TRUST_PROXY=loopback POS_REQUIRE_SHIFT=true POS_PUBLIC_ORIGIN=https://pos.mansutrendzgh.com /usr/bin/node server/preflight.js
ExecStart=/usr/bin/env NODE_ENV=production POS_MODE=live POS_LIVE_READ_ONLY=false POS_ALLOW_LIVE_WRITES=true POS_LIVE_RETAIL_CASH_DIRECT=true POS_LIVE_WHOLESALE_APPROVED=false POS_LIVE_WHOLESALE_ACCEPTANCE_REFERENCE= POS_ONLINE_BRIDGE_LIVE_ENABLED=false POS_ONLINE_BRIDGE_LOCAL_TEST=false POS_INSTORE_CASH_APPROVED=false POS_DESKTOP_SETUP_APPROVED=false POS_DESKTOP_RESERVATION_APPROVED=false POS_INSTORE_ACCEPTANCE_REFERENCE= POS_INSTORE_SOURCE_SHA256= POS_STAGING_APPROVED=false POS_STAGING_WHOLESALE_APPROVED=false POS_BIND_HOST=127.0.0.1 PORT=3188 POS_DATA_DIR=/var/lib/mansu-pos-live-trading POS_TRUST_PROXY=loopback POS_REQUIRE_SHIFT=true POS_PUBLIC_ORIGIN=https://pos.mansutrendzgh.com /usr/bin/node server/index.js
