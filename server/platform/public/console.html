<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mansu POS — Console</title>
<link rel="stylesheet" href="/static/signup.css">
<link rel="stylesheet" href="/static/console.css">
<script src="/static/console.js" defer></script>
</head>
<body>
<main class="page single" id="login-view">
  <section class="card">
    <p class="brand"><span class="mark">M</span> Mansu POS console</p>
    <form id="login" novalidate>
      <h2>Sign in</h2>
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <label>Authenticator code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
      <p class="error" id="login-error" role="alert" hidden></p>
      <button type="submit">Sign in</button>
    </form>
  </section>
</main>
<div id="app" hidden>
  <header class="console-top">
    <p class="brand"><span class="mark">M</span> Mansu POS console</p>
    <nav aria-label="Console"><button type="button" data-view="shops" aria-current="page">Shops</button><button type="button" data-view="audit">Audit log</button></nav>
    <span id="who"></span><button type="button" id="logout" class="link">Sign out</button>
  </header>
  <main class="console-main">
    <p class="error" id="error" role="alert" hidden></p>
    <section id="shops-view">
      <div class="console-stats" id="stats"></div>
      <div class="console-toolbar"><input id="filter" type="search" placeholder="Filter by name, address or email" aria-label="Filter shops"></div>
      <div class="table-wrap"><table><thead><tr><th>Shop</th><th>Status</th><th>Access</th><th>Plan</th><th>Owner</th><th>Store</th><th>Created</th></tr></thead><tbody id="shops"></tbody></table></div>
    </section>
    <section id="detail" hidden aria-labelledby="detail-title"></section>
    <section id="audit-view" hidden>
      <div class="table-wrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Shop</th><th>Detail</th></tr></thead><tbody id="audit"></tbody></table></div>
    </section>
  </main>
</div>
</body>
</html>
