name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run preflight

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for CI
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          echo "TEST_CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Start isolated production demo
        run: |
          nohup env POS_MODE=demo PORT=3000 POS_DATA_DIR="$RUNNER_TEMP/mansu-browser-data" npm start > /tmp/mansu-pos.log 2>&1 &
          echo $! > /tmp/mansu-pos.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mansu-pos.log
          exit 1
      - run: npm run test:browser
      - run: npm run test:a11y
      - name: Collect browser diagnostics
        if: failure()
        run: cp /tmp/mansu-pos.log test-results/server.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t mansu-pos:ci .
      - name: Smoke test container
        run: |
          trap 'docker rm -f mansu-pos-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name mansu-pos-ci -e POS_MODE=demo -e PORT=3000 -p 3000:3000 mansu-pos:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              curl -fsS http://127.0.0.1:3000/ | grep -q '/assets/index-'
              exit 0
            fi
            sleep 1
          done
          docker logs mansu-pos-ci
          exit 1
