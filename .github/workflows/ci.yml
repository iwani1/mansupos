name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run preflight

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser helper uses the Chromium binary bundled in @sparticuz/chromium.
      # Avoid a separate Playwright CDN download, which can stall the browser job.
      - name: Start isolated production demo
        run: |
          nohup env POS_MODE=demo PORT=3000 POS_DATA_DIR="$RUNNER_TEMP/mansu-browser-data" npm start > /tmp/mansu-pos.log 2>&1 &
          echo $! > /tmp/mansu-pos.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mansu-pos.log
          exit 1
      - run: npm run test:browser
      - run: npm run test:a11y
      - name: Collect browser diagnostics
        if: failure()
        run: cp /tmp/mansu-pos.log test-results/server.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t mansu-pos:ci .
      - name: Smoke test container
        run: |
          trap 'docker rm -f mansu-pos-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name mansu-pos-ci -e POS_MODE=demo -e PORT=3000 -p 3000:3000 mansu-pos:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              curl -fsS http://127.0.0.1:3000/ | grep -q '/assets/index-'
              exit 0
            fi
            sleep 1
          done
          docker logs mansu-pos-ci
          exit 1
      - name: Verify POS-only compose never claims the existing proxy's ports
        run: |
          cp .env.production.example .env
          sed -i 's/^POS_MODE=staging$/POS_MODE=demo/' .env
          sed -i 's/^POS_HOST_PORT=$/POS_HOST_PORT=31817/' .env
          docker compose -p mansu-pos-ci -f deploy/docker-compose.existing-proxy.yml config --quiet
          docker compose -p mansu-pos-ci -f deploy/docker-compose.existing-proxy.yml config --format json | node -e '
            let input = "";
            process.stdin.on("data", chunk => { input += chunk; });
            process.stdin.on("end", () => {
              const services = JSON.parse(input).services;
              const ports = services.pos?.ports || [];
              if (Object.keys(services).length !== 1 || ports.length !== 1 ||
                  ports[0].host_ip !== "127.0.0.1" || String(ports[0].published) !== "31817" ||
                  String(ports[0].target) !== "3000") process.exit(1);
            });
          '
          trap 'docker compose -p mansu-pos-ci -f deploy/docker-compose.existing-proxy.yml down -v >/dev/null 2>&1 || true' EXIT
          docker compose -p mansu-pos-ci -f deploy/docker-compose.existing-proxy.yml up -d --build pos
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:31817/api/health | grep -q '"mode":"demo"'; then exit 0; fi
            sleep 1
          done
          docker compose -p mansu-pos-ci -f deploy/docker-compose.existing-proxy.yml logs --tail=100 pos
          exit 1
