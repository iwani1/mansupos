name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: test -z "$(git ls-files 'wc-product-export-*.csv')" # no raw Woo export in branch head
      - run: npm test
      - name: Syntax-check uninstalled WooCommerce PHP extensions
        run: |
          php -l woocommerce/mansu-online-bridge/mansu-online-bridge.php
          php -l woocommerce/mansu-offline-reservations/mansu-offline-reservations.php
          php -l tests/fixtures/phase2-php-flow.php
          php -l tests/fixtures/phase2-php-live-gate.php
      - name: Exercise online Woo bridge against synthetic PHP WP/Woo callbacks
        run: node tests/online-bridge-php-native.mjs
      - run: npm run build:live
      - run: test -f dist/index.html && test -f dist/favicon.svg && test -f dist/manifest.webmanifest && test -f dist/sw.js && test -f dist/offline.html && test -f dist/icons/mansu-192.png && test -f dist/icons/mansu-512.png && test -f dist/icons/mansu-maskable-512.png && test ! -e dist/demo && test ! -e dist/products.csv && test ! -e dist/Stock-2026-11-12.pdf && test ! -e dist/data/instore-stock-snapshot.json && test ! -e dist/test-results && test -z "$(find dist -name 'wc-product-export-*.csv' -print -quit)"
      - run: npm audit --audit-level=high
      - run: npm run preflight
      - name: Validate isolated native systemd units
        run: systemd-analyze verify deploy/mansu-pos-staging.service deploy/mansu-pos-staging-backup.service deploy/mansu-pos-live-pilot.service deploy/mansu-pos-live-pilot-backup.service deploy/mansu-pos-live-trading.service deploy/mansu-pos-live-trading-backup.service

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser helper uses the Chromium binary bundled in @sparticuz/chromium.
      # Avoid a separate Playwright CDN download, which can stall the browser job.
      - name: Start isolated production demo
        run: |
          nohup env POS_MODE=demo PORT=3000 POS_DATA_DIR="$RUNNER_TEMP/mansu-browser-data" npm start > /tmp/mansu-pos.log 2>&1 &
          echo $! > /tmp/mansu-pos.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mansu-pos.log
          exit 1
      - name: Test existing web browser flows
        shell: bash
        run: |
          if ! npm run test:browser > "$RUNNER_TEMP/browser-suite.log" 2>&1; then
            tail -n 45 "$RUNNER_TEMP/browser-suite.log"
            note=$(tail -c 750 "$RUNNER_TEMP/browser-suite.log" | tr '\r\n' '  ')
            echo "::error title=Web browser regression (final output)::${note//%/%25}"
            exit 1
          fi
          tail -n 28 "$RUNNER_TEMP/browser-suite.log"
      - run: npm run test:a11y
      - name: Test desktop renderer with isolated SQLite and fake Woo (not Electron)
        run: npm run test:desktop:browser
      - name: Test isolated SAMPLE checkout, restart, NOT A RECEIPT and fake sync renderer
        run: npm run test:practice:browser
      - name: Test separate non-selling hardware-check renderer
        run: npm run test:hardware:browser
      - name: Collect browser diagnostics
        if: failure()
        run: cp /tmp/mansu-pos.log test-results/server.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t mansu-pos:ci .
      - name: Verify packaged physical-store sources
        run: |
          docker run --rm mansu-pos:ci node --input-type=module -e '
            import { loadInStoreSnapshot } from "./server/instore-catalog.js";
            import fs from "node:fs";
            const snapshot = loadInStoreSnapshot();
            if (snapshot.summary.items !== 1571 || snapshot.summary.needsReview !== 41 ||
                fs.readdirSync(".").some(name => /^wc-product-export-.*\.csv$/.test(name))) process.exit(1);
            console.log("In-store source hashes verified; raw Woo export excluded from runtime image.");
          '
      - name: Verify guarded central routes and shared contracts load in the web image
        run: docker run --rm mansu-pos:ci node --input-type=module -e 'await import("./server/app.js"); console.log("Central routes load without bundling Electron or the uninstalled Woo plugin.")'
      - name: Smoke test container
        run: |
          trap 'docker rm -f mansu-pos-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name mansu-pos-ci -e POS_MODE=demo -e PORT=3000 -p 3000:3000 mansu-pos:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              curl -fsS http://127.0.0.1:3000/ | grep -q '/assets/index-'
              exit 0
            fi
            sleep 1
          done
          docker logs mansu-pos-ci
          exit 1
      - name: Validate POS-only Compose configuration
        run: |
          cp .env.production.example .env
          sed -i 's/^POS_MODE=staging$/POS_MODE=demo/' .env
          sed -i 's/^POS_HOST_PORT=$/POS_HOST_PORT=31817/' .env
          if ! docker compose version; then echo '::error title=Compose plugin missing::Install Docker Compose v2 on the runner.'; exit 1; fi
          validation=$(docker compose --env-file .env -p mansu-pos-ci -f deploy/docker-compose.existing-proxy.yml config --quiet 2>&1) || {
            echo "::error title=Compose configuration invalid::${validation//$'\n'/; }"
            exit 1
          }
      - name: Verify POS-only Compose binds only localhost
        run: |
          docker compose --env-file .env -p mansu-pos-ci -f deploy/docker-compose.existing-proxy.yml config --format json | node -e '
            let input = "";
            process.stdin.on("data", chunk => { input += chunk; });
            process.stdin.on("end", () => {
              const services = JSON.parse(input).services;
              const ports = services.pos?.ports || [];
              if (Object.keys(services).length !== 1 || ports.length !== 1 ||
                  ports[0].host_ip !== "127.0.0.1" || String(ports[0].published) !== "31817" ||
                  String(ports[0].target) !== "3000") {
                console.error("::error title=Unexpected POS port mapping::" + JSON.stringify(ports));
                process.exit(1);
              }
            });
          '
      - name: Smoke test POS-only Compose container
        run: |
          trap 'docker compose --env-file .env -p mansu-pos-ci -f deploy/docker-compose.existing-proxy.yml down -v >/dev/null 2>&1 || true' EXIT
          docker compose --env-file .env -p mansu-pos-ci -f deploy/docker-compose.existing-proxy.yml up -d --build pos
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:31817/api/health | grep -q '"mode":"demo"'; then exit 0; fi
            sleep 1
          done
          docker compose --env-file .env -p mansu-pos-ci -f deploy/docker-compose.existing-proxy.yml logs --tail=100 pos
          echo '::error title=POS-only Compose unhealthy::Local health check failed.'
          exit 1

  windows-package:
    # Compile and inspect an UNSIGNED QA package on Windows. Never upload or
    # publish an installer: public GitHub Releases require separate approval,
    # code signing, a real Windows install/restore test and Woo acceptance.
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MANSU_SIGNED_UPDATE_BUILD: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test Windows SQLite ledger and offline cash queue
        run: node --test tests/desktop-store.test.js
        timeout-minutes: 4
      - name: Test signed central sync without HTTP
        run: node --test --test-name-pattern='^(?!read-only pilot routes)' tests/desktop-sync.test.js
        timeout-minutes: 3
      - name: Test read-only pilot HTTP route lock
        run: node --test --test-name-pattern='^read-only pilot routes' tests/desktop-sync.test.js
        timeout-minutes: 3
      - name: Parse the uninstalled Woo plugin (and lint PHP if installed)
        run: node --test tests/desktop-plugin-syntax.test.js
        timeout-minutes: 2
      - name: Download the official Windows Electron runtime for QA
        run: node node_modules/electron/install.js
        timeout-minutes: 8
      - name: Confirm Electron's bundled Node can open the offline SQLite ledger
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          if (-not (Test-Path .\node_modules\electron\dist\electron.exe)) {
            Write-Output '::error title=Electron runtime missing::npm ci did not install electron.exe on this Windows runner.'
            throw 'No Electron runtime binary was installed.'
          }
          $probe = "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync(':memory:');db.exec('CREATE TABLE t(x)');db.close();console.log('Electron SQLite available')"
          $output = & .\node_modules\electron\dist\electron.exe -e $probe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $brief = ($output -replace '[\r\n]+', ' ' -replace '%', '%25')
            if ($brief.Length -gt 750) { $brief = $brief.Substring(0,750) }
            Write-Output "::error title=Electron SQLite probe::Exit $code — $brief"
            throw 'Electron runtime cannot open node:sqlite.'
          }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Compile unsigned Windows QA installer without publishing
        run: npm run dist:win
        timeout-minutes: 12
      - name: Verify the installer stays unsigned and never becomes a release
        shell: pwsh
        run: |
          $policy = Get-Content -Raw desktop/update-policy.json | ConvertFrom-Json
          if ($policy.signed -ne $false) { throw 'Unsigned QA build unexpectedly enabled automatic updates.' }
          $setup = @(Get-ChildItem release -Filter 'MansuTRENDZGH-POS-*-Windows-Setup.exe' -File)
          if ($setup.Count -ne 1 -or $setup[0].Length -lt 50000000) { throw 'Exactly one complete Windows NSIS installer was expected.' }
          $signature = Get-AuthenticodeSignature $setup[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected QA installer signature state: $($signature.Status)" }
          $hash = Get-FileHash $setup[0].FullName -Algorithm SHA256
          Write-Host "Unsigned QA-only installer $($setup[0].Name): SHA256 $($hash.Hash)"
          Write-Host 'Installer discarded with this runner. No artifact or GitHub Release is published.'

  hardware-check-package:
    # The user approved a non-selling hardware test, NOT a POS release or Woo
    # installation. Only a deliberate, branch-pushed [hardware-qa] commit may
    # attach this short-lived unsigned tester; normal CI never uploads an EXE.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[hardware-qa]')
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify non-selling package boundaries
        run: node --test tests/hardware-test.test.js
      - name: Download official Windows Electron runtime
        run: node node_modules/electron/install.js
        timeout-minutes: 8
      - name: Build separate unsigned Windows hardware-check installer
        run: npm run dist:hardware:win
        timeout-minutes: 10
      - name: Smoke-test packaged Electron window and local controls (no printing)
        shell: pwsh
        timeout-minutes: 2
        run: |
          $exe = 'desktop/hardware-test/release/win-unpacked/MansutRENDZGH Hardware Check.exe'
          if (-not (Test-Path $exe)) { throw 'Packaged hardware-check executable was not found.' }
          $env:MANSU_HARDWARE_CI_SMOKE = '1'
          $process = Start-Process -FilePath $exe -ArgumentList '--qa-smoke' -PassThru
          try {
            if (-not $process.WaitForExit(45000)) {
              Stop-Process -Id $process.Id -Force
              throw 'The hardware-check Electron window did not finish its smoke test.'
            }
            if ($process.ExitCode -ne 0) { throw "Hardware-check Electron smoke test exited $($process.ExitCode)." }
          } finally { Remove-Item Env:MANSU_HARDWARE_CI_SMOKE }
      - name: Verify packaged files and unsigned installer; record hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'desktop/hardware-test/release'
          node scripts/check-hardware-package.mjs "$out/win-unpacked/resources/app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'Hardware test package contained unexpected files.' }
          $setup = @(Get-ChildItem $out -Filter 'MansutRENDZGH-Hardware-Check-*-Windows-Setup.exe' -File)
          if ($setup.Count -ne 1 -or $setup[0].Length -lt 50000000) {
            Write-Output "::error title=Hardware QA installer size::Expected one complete installer, found $($setup.Count); size $($setup[0].Length)."
            throw 'Exactly one complete hardware-only installer was expected.'
          }
          $signature = Get-AuthenticodeSignature $setup[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            Write-Output "::error title=Hardware QA signature::Unexpected signature state: $($signature.Status)"
            throw "Unexpected QA signature state: $($signature.Status)"
          }
          $hash = (Get-FileHash $setup[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup[0].Name)" | Set-Content -Encoding ascii "$out/SHA256.txt"
          Copy-Item docs/HARDWARE-TEST.md "$out/READ-ME-HARDWARE-TEST.md"
          Write-Host "TEST ONLY, unsigned, no sales, no POS ledger, no Woo: $($setup[0].Name), SHA256 $hash"
          Write-Host 'Only a time-limited Actions artifact is uploaded; no GitHub Release is created.'
      - uses: actions/upload-artifact@v7
        with:
          name: hardware-check-TEST-ONLY-Windows-x64-${{ github.run_id }}
          path: |
            desktop/hardware-test/release/MansutRENDZGH-Hardware-Check-*-Windows-Setup.exe
            desktop/hardware-test/release/SHA256.txt
            desktop/hardware-test/release/READ-ME-HARDWARE-TEST.md
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  practice-package:
    # The owner approved ONE non-selling workflow trial. Only an explicit
    # [practice-qa] push attaches this short-lived unsigned SAMPLE installer.
    # It never installs the Woo plugin, enables sales or creates a Release.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[practice-qa]')
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test isolated sample ledger and package boundaries on Windows
        run: node --test tests/pos-trial.test.js tests/pos-trial-package.test.js
        timeout-minutes: 3
      - name: Download official Windows Electron runtime
        run: node node_modules/electron/install.js
        timeout-minutes: 8
      - name: Build separate unsigned POS practice installer
        run: npm run dist:practice:win
        timeout-minutes: 12
      - name: Smoke packaged Electron UI, DPAPI checkout, restart and fake retry (no printing)
        shell: pwsh
        timeout-minutes: 2
        run: |
          $out = 'desktop/pos-trial/release'
          $exe = @(Get-ChildItem "$out/win-unpacked" -Filter '*Practice*.exe' -File)
          if ($exe.Count -ne 1) { throw 'Expected exactly one packaged practice executable.' }
          $env:MANSU_PRACTICE_CI_SMOKE = '1'
          $process = Start-Process -FilePath $exe[0].FullName -ArgumentList '--qa-smoke' -PassThru
          try {
            if (-not $process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force
              throw 'The sample practice Electron window did not finish its offline/restart/fake sync smoke test.'
            }
            if ($process.ExitCode -ne 0) { throw "Practice smoke test exited $($process.ExitCode)." }
          } finally { Remove-Item Env:MANSU_PRACTICE_CI_SMOKE }
      - name: Inspect packaged ASAR, unsigned installer, hash and guide
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'desktop/pos-trial/release'
          node scripts/check-pos-trial-package.mjs "$out/win-unpacked/resources/app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'Practice ASAR contained unexpected files or a live connection.' }
          $setup = @(Get-ChildItem $out -Filter 'Mansu-POS-PRACTICE-NOT-FOR-SALES-*-Windows-Setup.exe' -File)
          if ($setup.Count -ne 1 -or $setup[0].Length -lt 50000000) {
            Write-Output "::error title=Practice QA installer size::Expected one complete installer, found $($setup.Count); size $($setup[0].Length)."
            throw 'Exactly one complete practice-only installer was expected.'
          }
          $signature = Get-AuthenticodeSignature $setup[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected QA signature state: $($signature.Status)" }
          $hash = (Get-FileHash $setup[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup[0].Name)" | Set-Content -Encoding ascii "$out/SHA256.txt"
          Copy-Item docs/POS-PRACTICE-TRIAL.md "$out/READ-ME-PRACTICE.md"
          Write-Host "NOT FOR SALES, unsigned, fake sync only: $($setup[0].Name), SHA256 $hash"
          Write-Host 'Only a time-limited Actions artifact is uploaded; no GitHub Release or Woo change is made.'
      - uses: actions/upload-artifact@v7
        with:
          name: pos-practice-NOT-FOR-SALES-Windows-x64-${{ github.run_id }}
          path: |
            desktop/pos-trial/release/Mansu-POS-PRACTICE-NOT-FOR-SALES-*-Windows-Setup.exe
            desktop/pos-trial/release/SHA256.txt
            desktop/pos-trial/release/READ-ME-PRACTICE.md
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  online-pilot-package:
    # Separate installable ONLINE shell for the existing read-only pilot, NOT
    # the offline till and NOT a selling release. Only an explicit [online-qa]
    # push uploads a short-lived unsigned QA artifact. No live login or Woo
    # request is performed by CI; no GitHub Release or deployment is created.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[online-qa]')
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test HTTPS pilot pin, read-only request policy and package boundaries
        run: node --test tests/online-pilot.test.js
        timeout-minutes: 3
      - name: Download official Windows Electron runtime
        run: node node_modules/electron/install.js
        timeout-minutes: 8
      - name: Build separate unsigned online read-only pilot installer
        run: npm run dist:online:win
        timeout-minutes: 10
      - name: Smoke packaged native window with no live network or credentials
        shell: pwsh
        timeout-minutes: 2
        run: |
          $out = 'desktop/online/release'
          $exe = @(Get-ChildItem "$out/win-unpacked" -Filter '*Online*.exe' -File)
          if ($exe.Count -ne 1) { throw 'Expected exactly one packaged online pilot executable.' }
          $env:MANSU_ONLINE_CI_SMOKE = '1'
          $process = Start-Process -FilePath $exe[0].FullName -ArgumentList '--qa-smoke' -PassThru
          try {
            if (-not $process.WaitForExit(45000)) {
              Stop-Process -Id $process.Id -Force
              throw 'The online pilot Electron window did not finish its offline-free smoke test.'
            }
            if ($process.ExitCode -ne 0) { throw "Online pilot smoke test exited $($process.ExitCode)." }
          } finally { Remove-Item Env:MANSU_ONLINE_CI_SMOKE }
      - name: Inspect isolated ASAR, unsigned installer and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'desktop/online/release'
          node scripts/check-online-package.mjs "$out/win-unpacked/resources/app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'Online pilot package contained unexpected offline or production POS files.' }
          $setup = @(Get-ChildItem $out -Filter 'Mansu-POS-ONLINE-READ-ONLY-PILOT-*-Windows-Setup.exe' -File)
          if ($setup.Count -ne 1 -or $setup[0].Length -lt 50000000) { throw 'Exactly one complete online pilot installer was expected.' }
          $signature = Get-AuthenticodeSignature $setup[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected QA installer signature state: $($signature.Status)" }
          $hash = (Get-FileHash $setup[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup[0].Name)" | Set-Content -Encoding ascii "$out/SHA256.txt"
          Copy-Item docs/WINDOWS-ONLINE-PILOT.md "$out/READ-ME-ONLINE-PILOT.md"
          Write-Host "ONLINE READ-ONLY PILOT, unsigned, no checkout: $($setup[0].Name), SHA256 $hash"
          Write-Host 'Only a time-limited Actions artifact is uploaded; no GitHub Release or Woo change.'
      - uses: actions/upload-artifact@v7
        with:
          name: online-pos-READ-ONLY-PILOT-Windows-x64-${{ github.run_id }}
          path: |
            desktop/online/release/Mansu-POS-ONLINE-READ-ONLY-PILOT-*-Windows-Setup.exe
            desktop/online/release/SHA256.txt
            desktop/online/release/READ-ME-ONLINE-PILOT.md
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
